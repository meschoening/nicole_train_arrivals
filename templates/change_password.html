<!doctype html>
<html lang="en" data-theme="light">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token }}">
  <title>Change Password - Nicole's Train Tracker</title>
  <style>
    @font-face {
      font-family: "Quicksand";
      src: url("/api/font-file/Quicksand") format("truetype");
      font-display: swap;
    }

    :root {
      --font-body: "Quicksand", "Avenir Next", "Avenir", "Trebuchet MS", sans-serif;
      --font-display: "Quicksand", "Avenir Next", "Avenir", "Trebuchet MS", sans-serif;
      --bg: #f3f5f7;
      --surface: #ffffff;
      --surface-muted: #eff2f5;
      --border: rgba(15, 23, 42, 0.12);
      --text: #0f172a;
      --text-muted: #6b7280;
      --accent: #1b66ff;
      --radius-md: 12px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-body);
      background: var(--bg);
      color: var(--text);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(90deg, rgba(15, 23, 42, 0.04) 1px, transparent 1px),
        linear-gradient(0deg, rgba(15, 23, 42, 0.04) 1px, transparent 1px);
      background-size: 40px 40px;
      opacity: 0.35;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 24px;
      width: min(420px, 92vw);
      position: relative;
      z-index: 1;
    }

    .title {
      font-family: var(--font-display);
      font-size: 24px;
      margin: 0 0 8px;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 13px;
      margin-bottom: 20px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 12px;
    }

    label {
      font-size: 12px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    input {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 12px;
      font-size: 14px;
    }

    button {
      width: 100%;
      padding: 12px 16px;
      border-radius: 8px;
      border: none;
      background: var(--accent);
      color: #fff;
      font-weight: 600;
      cursor: pointer;
    }

    .notice,
    .error {
      padding: 12px 16px;
      border-radius: 8px;
      border: 1px solid var(--border);
      font-size: 13px;
      margin-bottom: 12px;
      background: var(--surface-muted);
    }

    .notice {
      border-color: rgba(27, 102, 255, 0.4);
      background: rgba(27, 102, 255, 0.08);
    }

    .error {
      border-color: rgba(192, 55, 43, 0.4);
      background: rgba(192, 55, 43, 0.12);
      color: #b42318;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1 class="title">Change Password</h1>
    <div class="subtitle">Please set a new password to continue.</div>

    <div class="notice">
      For security, you must change your password before accessing the settings.
    </div>

    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}

    <form method="post" action="/change-password">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <div class="field">
        <label for="current_password">Current Password</label>
        <input type="password" id="current_password" name="current_password" autocomplete="current-password" required>
      </div>
      <div class="field">
        <label for="new_password">New Password</label>
        <input type="password" id="new_password" name="new_password" autocomplete="new-password" required minlength="8">
      </div>
      <div class="field">
        <label for="confirm_password">Confirm New Password</label>
        <input type="password" id="confirm_password" name="confirm_password" autocomplete="new-password" required minlength="8">
      </div>
      <button type="submit">Change Password</button>
    </form>
  </div>
</body>

</html>
